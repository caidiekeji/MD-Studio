<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MD Editor</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-theme="light">
  <div id="app">
    <header id="appbar">
      <div class="app-logo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V6a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v13"/><path d="M7 9h5"/><path d="M7 13h7"/><path d="M7 17h4"/></svg>
        <span data-i18n="appName">MD Editor</span>
      </div>

      <div class="app-actions">
        <button type="button" class="app-btn" data-app="new" data-i18n-title="newDoc"></button>
        <span class="vsep"></span>
        <button type="button" class="app-btn" data-app="open-file" data-i18n-title="openFile"></button>
        <button type="button" class="app-btn" data-app="open-folder" data-i18n-title="openFolder"></button>
        <span class="vsep"></span>
        <button type="button" class="app-btn" data-app="save" data-i18n-title="save"></button>
        <button type="button" class="app-btn" data-app="save-as" data-i18n-title="saveAs"></button>
        <span class="vsep"></span>
        <button type="button" class="app-btn" data-app="export-html" data-i18n-title="exportHtml"></button>
        <button type="button" class="app-btn" data-app="export-pdf" data-i18n-title="exportPdf"></button>
        <span class="vsep"></span>
        <button type="button" class="app-btn" data-app="find" data-i18n-title="find"></button>
        <button type="button" class="app-btn" data-app="source" data-i18n-title="source"></button>
      </div>

      <div id="filePathLabel" class="file-label">未命名</div>
      <div class="spacer"></div>

      <div class="menu-wrap">
        <button type="button" class="app-btn" data-app="recent-menu" data-i18n-title="recent"></button>
        <div class="menu" id="recentMenu"></div>
      </div>
      <div class="menu-wrap">
        <button type="button" class="app-btn" data-app="settings-menu" data-i18n-title="settings"></button>
        <div class="menu" id="settingsMenu">
          <div class="menu-label" data-i18n="language">语言</div>
          <button type="button" class="menu-item" data-set="lang:zh">简体中文</button>
          <button type="button" class="menu-item" data-set="lang:en">English</button>
          <div class="menu-label" data-i18n="theme">主题</div>
          <button type="button" class="menu-item" data-set="theme:light" data-i18n="light">浅色</button>
          <button type="button" class="menu-item" data-set="theme:dark" data-i18n="dark">深色</button>
        </div>
      </div>
    </header>

    <main id="mainArea">
      <div id="editorHost"></div>
      <textarea id="sourceArea" class="hidden" spellcheck="false"></textarea>

      <div id="findBar" class="hidden">
        <div class="find-row">
          <input type="text" id="findInput" data-i18n-placeholder="findPlaceholder">
          <button type="button" class="find-btn toggle" id="findCase" data-fact="case" data-i18n-title="caseSensitive">Aa</button>
          <button type="button" class="find-btn" data-fact="prev" data-i18n-title="prev">‹</button>
          <button type="button" class="find-btn" data-fact="next" data-i18n-title="next">›</button>
          <span id="findStatus" class="find-status"></span>
          <button type="button" class="find-btn" data-fact="close">×</button>
        </div>
        <div class="find-row replace-row">
          <input type="text" id="replaceInput" data-i18n-placeholder="replacePlaceholder">
          <button type="button" class="find-btn text" data-fact="replace" data-i18n="replace">替换</button>
          <button type="button" class="find-btn text" data-fact="replace-all" data-i18n="replaceAll">全部替换</button>
        </div>
      </div>

      <div id="tableBar" class="hidden">
        <button type="button" class="find-btn" data-tact="row-up" title="在上方插入行">↑</button>
        <button type="button" class="find-btn" data-tact="row-down" title="在下方插入行">↓</button>
        <button type="button" class="find-btn" data-tact="row-del" title="删除行">−行</button>
        <span class="vsep"></span>
        <button type="button" class="find-btn" data-tact="col-left" title="在左侧插入列">←</button>
        <button type="button" class="find-btn" data-tact="col-right" title="在右侧插入列">→</button>
        <button type="button" class="find-btn" data-tact="col-del" title="删除列">−列</button>
      </div>
    </main>
  </div>

  <div id="appToast"></div>

  <script src="js/md-editor.js"></script>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
